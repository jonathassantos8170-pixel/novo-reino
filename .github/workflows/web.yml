name: Publicar jogo

on:

  workflow_dispatch:

  push:

    branches:

      - main

permissions:

  contents: read

  pages: write

  id-token: write

jobs:

  build:

    runs-on: ubuntu-latest

    container:

      image: barichello/godot-ci:4.3.0

    steps:

      - name: Baixar projeto

        uses: actions/checkout@v4

      - name: Preparar pasta

        run: mkdir -p build/web

      - name: Exportar jogo para Web

        run: godot --headless --path . --export-release "Web" build/web/index.html

      - name: Enviar jogo

        uses: actions/upload-pages-artifact@v3

        with:

          path: build/web

  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url
